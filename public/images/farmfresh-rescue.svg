<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgFF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="55%" stop-color="#0e2447"/>
      <stop offset="100%" stop-color="#173a70"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="freshGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020816" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgFF)"/>
  <!-- Subtle ambient glows -->
  <circle cx="1020" cy="110" r="240" fill="#38bdf8" opacity="0.12"/>
  <circle cx="160" cy="650" r="210" fill="#10b981" opacity="0.1"/>

  <!-- Browser Window Mockup -->
  <g filter="url(#cardShadow)">
    <rect x="84" y="64" width="1032" height="622" rx="22" fill="#f8fbff"/>
    <!-- Browser Top Bar -->
    <path d="M84 86 a22 22 0 0 1 22 -22 h988 a22 22 0 0 1 22 22 v34 h-1032 z" fill="#0b1830"/>
    <circle cx="118" cy="92" r="7" fill="#ef4444"/>
    <circle cx="142" cy="92" r="7" fill="#f59e0b"/>
    <circle cx="166" cy="92" r="7" fill="#10b981"/>
    <rect x="330" y="79" width="540" height="26" rx="13" fill="#15294c"/>
    <text x="600" y="96" text-anchor="middle" fill="#93c5fd" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="500">farmfresh-rescue.app · Live Farmer Marketplace</text>

    <!-- App Navbar -->
    <rect x="84" y="120" width="1032" height="68" fill="#ffffff"/>
    <line x1="84" y1="188" x2="1116" y2="188" stroke="#e2ecf8" stroke-width="1.5"/>
    <rect x="120" y="138" width="34" height="34" rx="10" fill="url(#freshGreen)"/>
    <path d="M130 162 C130 150, 144 146, 147 146 C147 156, 141 163, 130 162 Z" fill="#ffffff"/>
    <text x="166" y="161" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="20" font-weight="800">FarmFresh Rescue</text>
    <rect x="804" y="140" width="128" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="822" cy="156" r="4.5" fill="#10b981"/>
    <text x="834" y="160" fill="#047857" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">Live Listings</text>
    <rect x="946" y="138" width="134" height="36" rx="10" fill="url(#accentBlue)"/>
    <text x="1013" y="161" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">Post Harvest</text>

    <!-- Hero Banner inside App -->
    <rect x="120" y="210" width="630" height="148" rx="18" fill="url(#bgFF)"/>
    <rect x="148" y="232" width="176" height="24" rx="12" fill="rgba(56,189,248,0.18)"/>
    <text x="162" y="248" fill="#7dd3fc" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="600">DIRECT FARMER-TO-BUYER</text>
    <text x="148" y="286" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="24" font-weight="800">Rescue Fresh Surplus Produce</text>
    <text x="148" y="314" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="14">Real-time local harvest matching to reduce agricultural waste</text>
    <rect x="148" y="328" width="96" height="16" rx="8" fill="#10b981" opacity="0.25"/>
    <text x="158" y="340" fill="#6ee7b7" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="600">HTML · CSS · Python</text>

    <!-- Nearby Pickup Map Card -->
    <rect x="772" y="210" width="308" height="148" rx="18" fill="#ffffff" stroke="#dbe7f5" stroke-width="1.5"/>
    <text x="794" y="238" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="15" font-weight="700">Nearby Farm Hubs</text>
    <rect x="794" y="252" width="264" height="88" rx="12" fill="#edf5ff"/>
    <path d="M810 315 Q870 265 930 295 T1042 272" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 5"/>
    <circle cx="842" cy="296" r="8" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <circle cx="928" cy="294" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <circle cx="1012" cy="276" r="8" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <rect x="974" y="220" width="84" height="22" rx="11" fill="#dbeafe"/>
    <text x="1016" y="235" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">3.2 km avg</text>

    <!-- 3 Produce Listing Cards -->
    <!-- Card 1: Tomatoes -->
    <g>
      <rect x="120" y="382" width="304" height="268" rx="18" fill="#ffffff" stroke="#dbe7f5" stroke-width="1.5"/>
      <rect x="136" y="398" width="272" height="122" rx="12" fill="#fff1f2"/>
      <!-- Illustrated Fresh Tomatoes -->
      <circle cx="242" cy="466" r="32" fill="#ef4444"/>
      <circle cx="232" cy="456" r="9" fill="#fca5a5" opacity="0.5"/>
      <path d="M242 432 l-8 8 l8 -2 l8 2 z" fill="#15803d"/>
      <circle cx="292" cy="472" r="28" fill="#dc2626"/>
      <circle cx="284" cy="462" r="7" fill="#fca5a5" opacity="0.45"/>
      <path d="M292 442 l-7 7 l7 -2 l7 2 z" fill="#15803d"/>
      <rect x="148" y="410" width="90" height="24" rx="12" fill="#059669"/>
      <text x="193" y="426" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">FRESH HARVEST</text>
      <text x="142" y="548" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="17" font-weight="700">Organic Farm Tomatoes</text>
      <text x="142" y="572" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="13">45 kg available · 2.4 km away</text>
      <rect x="142" y="594" width="260" height="38" rx="10" fill="url(#accentBlue)"/>
      <text x="272" y="618" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="700">Connect with Farmer</text>
    </g>

    <!-- Card 2: Leafy Greens -->
    <g>
      <rect x="448" y="382" width="304" height="268" rx="18" fill="#ffffff" stroke="#dbe7f5" stroke-width="1.5"/>
      <rect x="464" y="398" width="272" height="122" rx="12" fill="#ecfdf5"/>
      <!-- Illustrated Greens -->
      <ellipse cx="578" cy="468" rx="34" ry="24" transform="rotate(-20 578 468)" fill="#10b981"/>
      <ellipse cx="618" cy="466" rx="34" ry="22" transform="rotate(18 618 466)" fill="#059669"/>
      <path d="M560 476 Q600 456 638 474" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
      <rect x="476" y="410" width="96" height="24" rx="12" fill="#2563eb"/>
      <text x="524" y="426" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">SAME-DAY PICKUP</text>
      <text x="470" y="548" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="17" font-weight="700">Fresh Spinach &amp; Greens</text>
      <text x="470" y="572" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="13">28 bundles · 1.8 km away</text>
      <rect x="470" y="594" width="260" height="38" rx="10" fill="url(#accentBlue)"/>
      <text x="600" y="618" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="700">Connect with Farmer</text>
    </g>

    <!-- Card 3: Sweet Mangoes / Citrus -->
    <g>
      <rect x="776" y="382" width="304" height="268" rx="18" fill="#ffffff" stroke="#dbe7f5" stroke-width="1.5"/>
      <rect x="792" y="398" width="272" height="122" rx="12" fill="#fffbeb"/>
      <circle cx="905" cy="466" r="30" fill="#f59e0b"/>
      <circle cx="950" cy="472" r="27" fill="#fbbf24"/>
      <path d="M905 434 Q918 424 926 436 Q914 442 905 434 Z" fill="#16a34a"/>
      <rect x="804" y="410" width="94" height="24" rx="12" fill="#0a162d"/>
      <text x="851" y="426" text-anchor="middle" fill="#7dd3fc" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">SURPLUS RESCUE</text>
      <text x="798" y="548" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="17" font-weight="700">Orchard Citrus Crate</text>
      <text x="798" y="572" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="13">60 kg available · 4.1 km away</text>
      <rect x="798" y="594" width="260" height="38" rx="10" fill="url(#accentBlue)"/>
      <text x="928" y="618" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="700">Connect with Farmer</text>
    </g>
  </g>
</svg>
