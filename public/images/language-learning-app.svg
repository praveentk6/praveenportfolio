<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="langBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf2ff"/>
      <stop offset="50%" stop-color="#d7e8ff"/>
      <stop offset="100%" stop-color="#c3dcff"/>
    </linearGradient>
    <linearGradient id="phoneBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="phoneShadow" x="-15%" y="-10%" width="135%" height="135%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0a162d" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#langBg)"/>
  <circle cx="240" cy="150" r="220" fill="#ffffff" opacity="0.55"/>
  <circle cx="990" cy="600" r="260" fill="#3b82f6" opacity="0.16"/>

  <!-- Left Smartphone: Daily Lesson & Progress -->
  <g filter="url(#phoneShadow)" transform="translate(215, 72) rotate(-5)">
    <rect x="0" y="0" width="330" height="620" rx="44" fill="#0a162d"/>
    <rect x="13" y="14" width="304" height="592" rx="34" fill="#f8fbff"/>
    <!-- Notch -->
    <rect x="115" y="24" width="100" height="20" rx="10" fill="#0a162d"/>

    <!-- Top Greeting -->
    <text x="36" y="84" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600">ANDROID STUDIO APP</text>
    <text x="36" y="112" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="22" font-weight="800">Daily Lessons</text>

    <!-- Progress Banner -->
    <rect x="34" y="132" width="262" height="114" rx="20" fill="url(#phoneBlue)"/>
    <text x="54" y="164" fill="#dbeafe" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">MODULE 02 · VOCABULARY</text>
    <text x="54" y="194" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="20" font-weight="800">Everyday Phrases</text>
    <rect x="54" y="214" width="220" height="10" rx="5" fill="rgba(255,255,255,0.28)"/>
    <rect x="54" y="214" width="154" height="10" rx="5" fill="#ffffff"/>

    <!-- Lesson Cards -->
    <rect x="34" y="266" width="262" height="82" rx="16" fill="#ffffff" stroke="#dbe7f5" stroke-width="1.5"/>
    <rect x="50" y="284" width="46" height="46" rx="13" fill="#eff6ff"/>
    <text x="73" y="314" text-anchor="middle" fill="#1d4ed8" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="18" font-weight="800">Aa</text>
    <text x="112" y="303" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="15.5" font-weight="700">Core Flashcards</text>
    <text x="112" y="324" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="12.5">12 Interactive Cards</text>

    <rect x="34" y="364" width="262" height="82" rx="16" fill="#ffffff" stroke="#dbe7f5" stroke-width="1.5"/>
    <rect x="50" y="382" width="46" height="46" rx="13" fill="#eff6ff"/>
    <path d="M65 405 h4 m4 -8 v16 m5 -12 v8 m5 -10 v12" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="112" y="401" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="15.5" font-weight="700">Pronunciation Lab</text>
    <text x="112" y="422" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="12.5">Audio Listening Practice</text>

    <rect x="34" y="462" width="262" height="82" rx="16" fill="#ffffff" stroke="#dbe7f5" stroke-width="1.5"/>
    <rect x="50" y="480" width="46" height="46" rx="13" fill="#0a162d"/>
    <text x="73" y="510" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">Q?</text>
    <text x="112" y="499" fill="#0a162d" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="15.5" font-weight="700">Quick Mastery Quiz</text>
    <text x="112" y="520" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="12.5">Multiple Choice Drills</text>
  </g>

  <!-- Right Smartphone: Active Flashcard Practice -->
  <g filter="url(#phoneShadow)" transform="translate(650, 56) rotate(4)">
    <rect x="0" y="0" width="336" height="632" rx="44" fill="#0a162d"/>
    <rect x="13" y="14" width="310" height="604" rx="34" fill="#0b1730"/>
    <rect x="118" y="24" width="100" height="20" rx="10" fill="#050d1e"/>

    <text x="38" y="84" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">VOCABULARY PRACTICE</text>
    <text x="38" y="114" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="22" font-weight="800">Translate Phrase</text>

    <!-- Main Flashcard -->
    <rect x="34" y="138" width="268" height="196" rx="22" fill="#132952" stroke="rgba(96,165,250,0.35)" stroke-width="1.5"/>
    <rect x="114" y="162" width="108" height="26" rx="13" fill="rgba(56,189,248,0.16)"/>
    <text x="168" y="179" text-anchor="middle" fill="#7dd3fc" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700">GREETING</text>
    <text x="168" y="236" text-anchor="middle" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="30" font-weight="800">Bonjour!</text>

    <!-- Audio Waveform -->
    <g stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round">
      <line x1="118" y1="286" x2="118" y2="294"/>
      <line x1="130" y1="278" x2="130" y2="302"/>
      <line x1="142" y1="270" x2="142" y2="310"/>
      <line x1="154" y1="280" x2="154" y2="300"/>
      <line x1="166" y1="266" x2="166" y2="314"/>
      <line x1="178" y1="276" x2="178" y2="304"/>
      <line x1="190" y1="272" x2="190" y2="308"/>
      <line x1="202" y1="282" x2="202" y2="298"/>
      <line x1="214" y1="286" x2="214" y2="294"/>
    </g>

    <!-- Quiz Options -->
    <rect x="34" y="360" width="268" height="54" rx="14" fill="rgba(37,99,235,0.34)" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="58" y="393" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">A.  Hello / Good Morning</text>

    <rect x="34" y="428" width="268" height="54" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(148,163,184,0.2)"/>
    <text x="58" y="461" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="500">B.  See you tomorrow</text>

    <rect x="34" y="496" width="268" height="54" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(148,163,184,0.2)"/>
    <text x="58" y="529" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="500">C.  Thank you very much</text>

    <rect x="34" y="564" width="268" height="36" rx="12" fill="url(#phoneBlue)"/>
    <text x="168" y="587" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" font-weight="700">Check Answer</text>
  </g>
</svg>
