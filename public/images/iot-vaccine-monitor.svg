<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="iotBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050d1e"/>
      <stop offset="55%" stop-color="#0a1936"/>
      <stop offset="100%" stop-color="#112b5c"/>
    </linearGradient>
    <linearGradient id="waveArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tempCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="iotShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000511" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#iotBg)"/>
  <!-- Subtle Tech Grid -->
  <g stroke="rgba(148,163,184,0.07)" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200"/>
    <path d="M200 0 V750 M400 0 V750 M600 0 V750 M800 0 V750 M1000 0 V750"/>
  </g>
  <circle cx="980" cy="140" r="240" fill="#2563eb" opacity="0.22"/>
  <circle cx="200" cy="600" r="220" fill="#38bdf8" opacity="0.12"/>

  <!-- Dashboard Frame -->
  <g filter="url(#iotShadow)">
    <rect x="76" y="68" width="1048" height="614" rx="24" fill="#0b1730" stroke="rgba(96,165,250,0.28)" stroke-width="1.5"/>

    <!-- Header -->
    <rect x="76" y="68" width="1048" height="74" rx="24" fill="#0f2042"/>
    <rect x="76" y="118" width="1048" height="24" fill="#0f2042"/>
    <line x1="76" y1="142" x2="1124" y2="142" stroke="rgba(148,163,184,0.18)"/>
    <circle cx="122" cy="105" r="18" fill="url(#tempCard)"/>
    <path d="M122 95 v12 m-4 4 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="154" y="101" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="19" font-weight="800">Vaccine Cold-Chain IoT Monitor</text>
    <text x="154" y="121" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">REAL-TIME TELEMETRY &amp; THERMAL ALERT SYSTEM</text>

    <rect x="920" y="88" width="172" height="34" rx="17" fill="rgba(16,185,129,0.16)" stroke="rgba(52,211,153,0.45)"/>
    <circle cx="942" cy="105" r="5" fill="#34d399"/>
    <text x="956" y="110" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700">SAFE ZONE ACTIVE</text>

    <!-- Left Column: Live Temperature & Sensor Node -->
    <rect x="108" y="170" width="320" height="224" rx="18" fill="url(#tempCard)"/>
    <text x="134" y="204" fill="#dbeafe" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600">CHAMBER A · CURRENT TEMP</text>
    <text x="134" y="284" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="68" font-weight="800">4.2°C</text>
    <rect x="134" y="308" width="174" height="28" rx="14" fill="rgba(255,255,255,0.18)"/>
    <text x="150" y="326" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">TARGET: 2.0°C – 8.0°C</text>
    <text x="134" y="368" fill="#e0f2fe" font-family="Inter, Segoe UI, sans-serif" font-size="13">Humidity: 48% · Sensor Online</text>

    <!-- IoT Sensor Hardware Card -->
    <rect x="108" y="416" width="320" height="236" rx="18" fill="#102246" stroke="rgba(148,163,184,0.2)"/>
    <text x="134" y="448" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="15.5" font-weight="700">IoT Sensor &amp; Alert Nodes</text>
    <!-- Cold-Chain Vials & Microcontroller Schematic -->
    <rect x="134" y="470" width="124" height="86" rx="12" fill="#071329" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="156" y="492" width="44" height="42" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="178" y="517" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">MCU</text>
    <circle cx="228" cy="500" r="6" fill="#34d399"/>
    <circle cx="228" cy="524" r="6" fill="#38bdf8"/>

    <!-- Vaccine Vials Illustration -->
    <g transform="translate(284,474)">
      <rect x="0" y="18" width="32" height="58" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="6" y="8" width="20" height="10" rx="3" fill="#2563eb"/>
      <rect x="4" y="44" width="24" height="26" rx="4" fill="#38bdf8" opacity="0.65"/>
      <rect x="44" y="18" width="32" height="58" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="50" y="8" width="20" height="10" rx="3" fill="#2563eb"/>
      <rect x="48" y="40" width="24" height="30" rx="4" fill="#60a5fa" opacity="0.65"/>
    </g>

    <rect x="134" y="576" width="268" height="54" rx="12" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)"/>
    <text x="152" y="599" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">THRESHOLD ALERT ENGINE</text>
    <text x="152" y="618" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="12">Instant SMS / Alarm if Temp &gt; 8°C or &lt; 2°C</text>

    <!-- Right Column: Temperature Telemetry Chart -->
    <rect x="454" y="170" width="638" height="320" rx="18" fill="#102246" stroke="rgba(148,163,184,0.2)"/>
    <text x="482" y="206" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="17" font-weight="700">24-Hour Thermal Stability Curve</text>
    <text x="482" y="226" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12.5">Continuous IoT temperature polling every 5 seconds</text>

    <!-- Safe Band Shading -->
    <rect x="482" y="266" width="582" height="128" rx="8" fill="rgba(16,185,129,0.08)"/>
    <line x1="482" y1="266" x2="1064" y2="266" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1010" y="258" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="11">MAX 8.0°C</text>
    <line x1="482" y1="394" x2="1064" y2="394" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1012" y="412" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="11">MIN 2.0°C</text>

    <!-- Area & Line Graph -->
    <path d="M482 342 C538 330, 582 350, 642 332 C702 314, 756 346, 816 322 C876 298, 940 338, 1002 318 L1064 326 L1064 434 L482 434 Z" fill="url(#waveArea)"/>
    <path d="M482 342 C538 330, 582 350, 642 332 C702 314, 756 346, 816 322 C876 298, 940 338, 1002 318 L1064 326" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="642" cy="332" r="5.5" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="816" cy="322" r="5.5" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="1002" cy="318" r="6.5" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>

    <!-- Bottom Right Status Cards -->
    <rect x="454" y="512" width="200" height="140" rx="16" fill="#102246" stroke="rgba(148,163,184,0.2)"/>
    <text x="476" y="544" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">ACTIVE CHAMBERS</text>
    <text x="476" y="592" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="36" font-weight="800">04 / 04</text>
    <text x="476" y="626" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="12">All Sensors Nominal</text>

    <rect x="673" y="512" width="200" height="140" rx="16" fill="#102246" stroke="rgba(148,163,184,0.2)"/>
    <text x="695" y="544" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">ALERT LATENCY</text>
    <text x="695" y="592" fill="#38bdf8" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="36" font-weight="800">&lt; 1.2s</text>
    <text x="695" y="626" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="12">Real-Time Trigger</text>

    <rect x="892" y="512" width="200" height="140" rx="16" fill="#102246" stroke="rgba(245,158,11,0.35)"/>
    <text x="914" y="544" fill="#fbbf24" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">EXCURSION LOGS</text>
    <text x="914" y="592" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="36" font-weight="800">0</text>
    <text x="914" y="626" fill="#93c5fd" font-family="JetBrains Mono, monospace" font-size="12">Zero Breaches Today</text>
  </g>
</svg>
